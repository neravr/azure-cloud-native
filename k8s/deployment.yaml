apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnative-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudnative-api
  template:
    metadata:
      labels:
        app: cloudnative-api
    spec:
      containers:
      - name: cloudnative-api
        image: acrcloudnativedev.azurecr.io/cloudnative-api:v1
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5